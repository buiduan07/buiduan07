name: Generate Snake

on:
  # Tự động chạy mỗi 24 giờ
  schedule:
    - cron: "0 0 * * *"
  
  # Cho phép bạn bấm nút tự chạy bằng tay bất cứ lúc nào
  workflow_dispatch:
  
  # Tự chạy mỗi khi bạn update file readme
  push:
    branches:
    - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # Sinh ra con rắn từ tài khoản của bạn với đúng màu bạn thích (Rắn hồng, ô xanh nước biển)
      - name: generate-github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=ff69b4&color_dots=#e1f5fe,#81d4fa,#29b6f6,#0288d1,#01579b
            
      # Đẩy file ảnh con rắn vừa sinh vào một nhánh ẩn tên là output
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
